plugins {
    id 'java'
}

group = 'com.vit.demo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    testLogging {
        showStandardStreams = true
        events "passed", "failed"
    }
}

jar {
    archiveBaseName = 'ci-jenkins-demo'
    archiveVersion = '1.0.0'
    manifest {
        attributes 'Main-Class': 'com.vit.demo.App'
    }
}
